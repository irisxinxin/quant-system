<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kova 交易学习笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --bg2:#0e1117; --s1:#141923; --s2:#1a202c;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --text:#e6edf3; --text2:#9ba6b4; --text3:#6b7585;
  --accent:#f59e0b; --accent2:#fbbf24;
  --cyan:#39c5cf; --green:#4ade80; --red:#f87171; --blue:#58a6ff; --purple:#c084fc;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(245,158,11,.07), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(57,197,207,.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter','Noto Sans SC',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.7; min-height:100vh; letter-spacing:.005em;
}
.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

/* ── 顶部进度条 ── */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;
  background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(245,158,11,.6);transition:width .1s}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);
  background:rgba(11,14,20,.78);border-bottom:1px solid var(--border)}
.head-in{max-width:1240px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(135deg,var(--accent),#b45309);color:#1a1205;box-shadow:0 4px 14px rgba(245,158,11,.35)}
.logo .sub{color:var(--text3);font-weight:500;font-size:12px;margin-left:2px}
.head-stat{margin-left:auto;display:flex;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);
  border-radius:10px;padding:8px 13px;width:230px;transition:border-color .15s}
.search:focus-within{border-color:rgba(245,158,11,.5)}
.search input{background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13px;width:100%}
.search svg{flex-shrink:0;opacity:.5}

/* ── 布局 ── */
.wrap{max-width:1240px;margin:0 auto;padding:0 26px;display:grid;grid-template-columns:230px 1fr;gap:38px;align-items:start}
nav.toc{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow-y:auto;padding:22px 0 40px}
.toc-group{margin-bottom:20px}
.toc-group-t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);padding:0 12px 8px}
.toc a{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--text2);
  border-left:2px solid transparent;transition:all .14s;text-decoration:none}
.toc a:hover{color:var(--text);background:rgba(255,255,255,.03)}
.toc a.on{color:var(--accent2);border-left-color:var(--accent);background:rgba(245,158,11,.07);font-weight:600}
.toc a .dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.toc a.on .dot{background:var(--accent)}

main{padding:30px 0 120px;min-width:0}

/* ── Hero ── */
.hero{padding:30px 32px;border-radius:18px;margin-bottom:36px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(245,158,11,.10),rgba(57,197,207,.05));border:1px solid var(--border2)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,158,11,.18),transparent 70%);pointer-events:none}
.hero h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.hero p{color:var(--text2);max-width:620px;font-size:14.5px}
.hero .meta{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
.hero .meta div{font-size:12.5px;color:var(--text3)}
.hero .meta b{color:var(--accent2);font-weight:700;font-size:16px;display:block;font-family:'JetBrains Mono',monospace}

/* ── 章节 ── */
section{margin-bottom:48px;scroll-margin-top:90px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.sec-head .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--s1);border:1px solid var(--border)}
.sec-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec-head .cnt{margin-left:auto;font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* ── 卡片 ── */
.card{background:linear-gradient(180deg,var(--s1),rgba(20,25,35,.6));border:1px solid var(--border);
  border-radius:14px;padding:22px 24px;margin-bottom:16px;transition:border-color .16s,transform .16s}
.card:hover{border-color:var(--border2)}
.card-t{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;margin-bottom:6px}
.card-t .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.22);border-radius:6px;padding:2px 7px;flex-shrink:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.t-trend{color:var(--accent);background:rgba(245,158,11,.1)}
.t-vol{color:var(--cyan);background:rgba(57,197,207,.1)}
.t-mom{color:var(--purple);background:rgba(192,132,252,.1)}
.t-risk{color:var(--red);background:rgba(248,113,113,.1)}
.t-base{color:var(--text2);background:rgba(255,255,255,.05)}
.card-body{color:var(--text2);font-size:14.5px}
.card-body p{margin:10px 0}
.card-body ul{margin:10px 0;padding-left:20px}
.card-body li{margin:5px 0}
.card-body strong{color:var(--text);font-weight:600}
.card-body code{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);
  background:rgba(57,197,207,.08);padding:1.5px 6px;border-radius:5px}
.card-body h4{color:var(--text);font-size:14px;font-weight:700;margin:16px 0 6px}

/* ── Callout ── */
.callout{border-radius:10px;padding:12px 16px;margin:14px 0;font-size:13.5px;border:1px solid;display:flex;gap:11px}
.callout .ci{flex-shrink:0;font-size:15px;line-height:1.4}
.co-key{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.25);color:#fcd9a0}
.co-key strong{color:var(--accent2)}
.co-formula{background:rgba(57,197,207,.06);border-color:rgba(57,197,207,.22);color:#a5e8ed;
  font-family:'JetBrains Mono',monospace;font-size:13px}
.co-warn{background:rgba(248,113,113,.06);border-color:rgba(248,113,113,.22);color:#fbb6b6}
.co-info{background:rgba(88,166,255,.06);border-color:rgba(88,166,255,.2);color:#a9cdfb}

.src{margin-top:14px;font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:6px;
  border-top:1px dashed var(--border);padding-top:11px}
.src .badge{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-family:'JetBrains Mono',monospace}

.empty{text-align:center;padding:50px 20px;color:var(--text3);border:1px dashed var(--border2);border-radius:14px;background:rgba(255,255,255,.012)}
.empty .e-ic{font-size:34px;margin-bottom:12px;opacity:.6}

/* FAQ 专用 */
.qa{font-size:16px;font-weight:700;color:#fcd9a0;display:flex;gap:9px;align-items:flex-start;margin-bottom:4px}
.qa .qm{color:var(--accent);font-family:'JetBrains Mono',monospace}
.stop-step{display:flex;align-items:center;gap:14px;padding:11px 15px;background:rgba(255,255,255,.025);
  border:1px solid var(--border);border-left-width:3px;border-radius:9px;margin-bottom:9px}
.stop-step .ph{font-size:13px;font-weight:700;min-width:104px;color:var(--text)}
.stop-step .ds{font-size:13px;color:var(--text2);flex:1}
.stop-step .lv{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;white-space:nowrap}
.vcp-fig{background:#0a0d13;border:1px solid var(--border2);border-radius:12px;padding:10px 10px 4px;margin:18px 0}
.vcp-fig svg{display:block;width:100%;height:auto}
.vcp-cap{font-size:11.5px;color:var(--text3);text-align:center;padding:9px 6px 4px;line-height:1.6}
.dfn{display:grid;grid-template-columns:auto 1fr;gap:11px 16px;margin:16px 0;align-items:start}
.dfn dt{font-weight:700;color:var(--accent2);white-space:nowrap;font-size:14px}
.dfn dd{color:var(--text2);margin:0;font-size:14px}

footer{max-width:1240px;margin:0 auto;padding:24px 26px 50px;color:var(--text3);font-size:12px;border-top:1px solid var(--border)}

@media(max-width:880px){
  .wrap{grid-template-columns:1fr;padding:0 16px}
  nav.toc{display:none}
  .head-in{padding:12px 16px}
  .search{width:150px}
}
</style>
</head>
<body>
<div id="progress"></div>

<header>
  <div class="head-in">
    <div class="logo">
      <span class="k">K</span>
      <span>Kova 交易学习笔记<span class="sub">· 倒推研究专用</span></span>
    </div>
    <div class="head-stat">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="搜索笔记…" autocomplete="off">
      </label>
      <a href="/stops" style="padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:600;text-decoration:none;background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.3);white-space:nowrap">🪜 止损面板</a>
      <a href="/" style="padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:600;text-decoration:none;background:var(--s1);color:var(--text2);border:1px solid var(--border);white-space:nowrap">⚡ 仪表盘</a>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="toc" id="toc"></nav>
  <main id="main"></main>
</div>

<footer>
  Kova 交易学习笔记 · 用于反向研究其量化指标 ·
  <span style="color:var(--text2)">本页内容会随你发来的截图持续更新</span>
</footer>

<script>
/* ===================================================================
   笔记数据 —— 以后每发一张截图，往这里加一条卡片即可
   chapter: 所属章节 | group: 侧栏分组 | 卡片字段见下
   tag 可选: trend / vol / mom / risk / base
=================================================================== */
const CHAPTERS = [
  {
    id:"intro", group:"开始", icon:"📌", title:"导读 · 这份笔记是什么",
    cards:[
      {
        title:"研究目标", tags:[["base","研究方法"]],
        body:`<p>这份笔记记录 <strong>Kova Investment Research</strong> 的交易方法与指标用法，目的是<strong>反向推导(倒推)其量化公式</strong>，最终做成可在 TradingView 运行、并接入 Telegram 推送的指标。</p>
        <div class="callout co-warn"><span class="ci">⚠️</span><div><strong>诚实性原则：</strong>Kova 公式闭源，无法 1:1 复刻。这里做的是<strong>行为逼近</strong> —— 提取可观测规律(分数怎么变、颜色何时切换、Hold/Reduce 何时触发)，再用经典量化构件拟合，并用真实历史数据回测校准。不编造、不画假信号。</div></div>`,
      },
      {
        title:"怎么用这页", tags:[["base","使用说明"]],
        body:`<ul>
          <li>左侧目录按章节跳转，顶部可搜索关键词</li>
          <li>每张你发来的教育截图 → 我翻译总结成中文卡片填进对应章节</li>
          <li><span style="color:var(--accent2)">🔑 重点</span> / <span style="color:var(--cyan)">公式线索</span> 会用高亮框标出，方便后面建模时直接引用</li>
        </ul>`,
      },
    ]
  },
  {
    id:"observe", group:"开始", icon:"🔍", title:"先验观测 · 从行情图倒推",
    intro:"基于你最早发的 5 张行情图(TSLA/BE/SIVE/MU/OKTA)，我已能读出的可观测规律。这是<strong>我的推断</strong>，非 Kova 官方说明，后续用教育文章校正。",
    cards:[
      {
        title:"Kova Score(0–100 综合健康分)", tags:[["trend","趋势"],["mom","动量"],["vol","量能"]],
        body:`<p>样本读数：TSLA <code>18↓</code>、BE <code>91↓</code>、SIVE <code>99↑⭐</code>、MU <code>99↑</code>、OKTA <code>96↑</code>。</p>
        <ul><li><code>↑/↓</code> = 分数变化方向；<code>⭐</code> = 顶格(≈99)</li>
        <li>大概率是 <strong>趋势 + 动量 + 量能 + 相对强度</strong> 的加权合成</li></ul>
        <div class="callout co-formula"><span class="ci">∑</span><div>Score ≈ w₁·趋势(均线排列/斜率) + w₂·动量(RSI/ROC) + w₃·量能(量比/OBV) + w₄·相对强度(vs 大盘) → 归一化到 0–100</div></div>`,
      },
      {
        title:"动作标签 Hold / Reduce 和分数不是一回事", tags:[["risk","风控"]],
        body:`<p>关键反例：MU <code>99</code>、OKTA <code>96</code> 显示 <strong style="color:var(--red)">REDUCE</strong>，而 SIVE <code>99</code> 却是 <strong>Hold</strong>。</p>
        <p>线索：MU/OKTA 价格<strong>抛物线式远离黄色快线</strong>(乖离过大/极度超买)，SIVE 最后一根已回踩均线。</p>
        <div class="callout co-key"><span class="ci">🔑</span><div><strong>推断：</strong>Reduce ≈ 价格对短均线的<strong>乖离率 > 阈值</strong>(过度延伸)，而非"分数高就减"。分数管"健不健康"，动作管"贵不贵 / 该不该止盈"。</div></div>`,
      },
      {
        title:"均线带(Stage Analysis 风格)", tags:[["trend","趋势"]],
        body:`<p>叠了 4 条均线：<strong style="color:var(--accent)">黄(≈快线 10)</strong>、<strong style="color:var(--cyan)">青(≈20)</strong>、<strong style="color:var(--purple)">紫(≈50)</strong>、<strong style="color:var(--green)">绿(≈100/200)</strong>。多头排列时呈扩散向上的"带"。</p>`,
      },
      {
        title:"成交量配色", tags:[["vol","量能"]],
        body:`<ul>
          <li><strong style="color:var(--green)">绿</strong> = 普通上涨日</li>
          <li><strong style="color:var(--red)">红</strong> = 下跌日</li>
          <li><strong style="color:var(--cyan)">青亮</strong> = 放量异动(量 &gt; 量均线 × 倍数，疑似 1.5–2×)</li>
          <li><strong style="color:var(--purple)">紫</strong> = 缩量/吸筹区(OKTA 横盘段全是紫)</li>
        </ul>
        <p>量柱上方白线 = 成交量移动均线。</p>`,
      },
      {
        title:"底部柱状震荡器", tags:[["mom","动量"]],
        body:`<p>蓝/红柱、形态平滑、量程 <code>+200 / −100</code> 不对称 → 像自定义的<strong>资金流 / 动量</strong>指标(类 MACD 柱 或 CVD 累积量差)。需要单独放大的截图来确认。</p>`,
      },
    ]
  },
  {
    id:"foundations", group:"理论根基", icon:"🏛️", title:"三大体系溯源 · 深度详解",
    intro:"Kova 的方法 = 三套公开经典体系的合成。把每套的来龙去脉、核心逻辑、可量化模板讲透 —— 理解了根，看任何 Kova 信号都能秒懂。",
    cards:[
      {
        title:"① William O'Neil · CANSLIM 体系", tags:[["base","奠基"],["trend","趋势"]],
        body:`<p><strong>出处</strong>：《笑傲股市》(How to Make Money in Stocks)，作者 William J. O'Neil，《投资者商业日报》(IBD) 创始人。这是整个"成长动量"流派的<strong>开山祖师</strong>，后面 Minervini、Morales 全是这一脉的徒子徒孙。</p>
        <p>O'Neil 研究了 1880s 至今上百只翻倍大牛股，归纳出它们启动前的<strong>共同特征</strong>，做成 7 字母清单 <strong>CAN SLIM</strong>：</p>
        <ul>
          <li><strong>C</strong> — Current Earnings 当季盈利：最近季度 <strong>EPS 同比 ≥ 25%</strong>，越高越好</li>
          <li><strong>A</strong> — Annual Earnings 年度盈利：年度 EPS 增长 ≥ 25%，<strong>ROE ≥ 17%</strong></li>
          <li><strong>N</strong> — New 新东西：新产品/新管理层/新高 —— 尤其<strong>股价创历史新高</strong>(突破时)</li>
          <li><strong>S</strong> — Supply &amp; Demand 供需：流通盘适中，关键买点要<strong>放量</strong></li>
          <li><strong>L</strong> — Leader 龙头：买行业里最强的(<strong>RS Rating ≥ 80</strong>)，别买落后补涨的</li>
          <li><strong>I</strong> — Institutional 机构：<strong>持股基金数逐季增加</strong>，有大资金背书</li>
          <li><strong>M</strong> — Market 大盘：<strong>约 75% 个股跟随大盘</strong>，熊市/回调期一律空仓</li>
        </ul>
        <div class="callout co-info"><span class="ci">📐</span><div><strong>O'Neil 的标志性工具</strong>：① RS Rating(相对强度评级 1–99，全市场横截面排名)；② 底部形态(base) —— 最经典的是<strong>杯柄形态(Cup with Handle)</strong>，还有平底(flat base)、双底(double bottom)；③ 买点(pivot/buy point) = 形态阻力位；④ <strong>7–8% 铁律止损</strong>；⑤ <strong>Follow-Through Day(跟随确认日)</strong> 判断大盘反转。</div></div>
        <div class="callout co-key"><span class="ci">🔑</span><div>Kova 文章里的<strong>选股清单(EPS25/Sales20/ROE17/RS80/52周高点15%内)、7%止损、"M"市场环境</strong>全部来自这里。CANSLIM 提供了<strong>"买什么"</strong>的框架。</div></div>`,
        source:"《How to Make Money in Stocks》· W. O'Neil"
      },
      {
        title:"②a Mark Minervini · SEPA 与趋势模板", tags:[["base","奠基"],["trend","趋势"]],
        body:`<p><strong>出处</strong>：《股票魔法师》(Trade Like a Stock Market Wizard)、《Think &amp; Trade Like a Champion》，作者 Mark Minervini —— 两届美国投资冠军(US Investing Championship)，O'Neil 体系的集大成者，把"买点择时"做到了极致。</p>
        <p>他的总框架叫 <strong>SEPA</strong>(Specific Entry Point Analysis 精确买点分析)，五大要素：<strong>趋势 Trend / 基本面 Fundamentals / 催化剂 Catalyst / 买点 Entry / 卖点 Exit</strong>。</p>
        <p>其中最可量化、最值钱的是<strong>趋势模板(Trend Template)</strong> —— 一只票必须<strong>全部满足 8 条</strong>才算进入"可买的强势阶段(Stage 2 上升期)"：</p>
        <div class="callout co-formula"><span class="ci">✓</span><div>
        1. 价 &gt; MA150 且 价 &gt; MA200<br>
        2. MA150 &gt; MA200<br>

        body:`<p style="color:var(--text2);font-size:13px"><em>作者 KOVA INVESTMENT RESEARCH 动量交易 · Apr 17 2026 · PAID</em></p>
        <p>在上一篇里我列了五条简单规则：选强势股、买突破、7% 止损、只对赢家加仓、趋势破位时卖出。几个朋友回信说逻辑想通了，但还是不知道具体该「做」什么。突破在图上长什么样？止损到底放在哪？怎么加仓？</p>
        <p>所以这一篇讲得更深：更多技术细节、更多数字、更具体。语言保持朴素，我标出了适合配图的地方，方便你把概念对应到真实屏幕上看到的东西。</p>
        <h4>1. 选股：是清单，不是猜测（A Checklist, Not a Guess）</h4>
        <p>选股不神秘，它是过滤（filtering）。真正的赢家往往同时勾选多个条件。这是我用的清单 —— 任意一只票，60 秒走一遍。</p>
        <p><strong>基本面（公司必须真的在成长）</strong></p>
        <ul>
          <li>EPS 同比增长 25%+（最近 1–2 个季度）。越高越好。</li>
          <li>营收增长 20%+。没有营收增长的利润是挤出来的利润，不是真增长。</li>
          <li>ROE 17%+。</li>
          <li>最好是较新的高成长公司，不是百年蓝筹。</li>
        </ul>
        <p><strong>技术面（股票本身得在强势区）</strong></p>
        <ul>
          <li>相对强度（RS）评级 80 或更高。IBD、MarketSurge、Finviz 上可查。</li>
          <li>在 52 周高点的 15% 以内 —— 越近越好。</li>
          <li>周线图上价格同时在 10 周和 40 周均线之上，且两条均线都向上。</li>
          <li>行业组在 IBD 197 个行业的前 40。</li>
        </ul>
        <p><strong>机构（大资金在买）</strong></p>
        <ul>
          <li>持有该股的基金数量逐季增加。</li>
          <li>有知名基金在内加分。</li>
        </ul>
        <p><strong>市场环境（CAN SLIM 里的 M）</strong></p>
        <ul>
          <li>大盘处于确认的上升趋势。</li>
          <li>近期没有成堆的派发日（distribution days）。</li>
          <li>熊市或回调中，跳过。这是所有人都忽略的一条。约 75% 的个股跟随大盘，所以对抗大势就是对抗地心引力。</li>
        </ul>
        <p>每一项都勾选 → 候选。漏一项 → 下一只。股票有几千只，你不需要这一只。</p>
        <div class="callout co-info"><span class="ci">❝</span><div>我见过最常见的错误：纯看基本面选（好公司、烂图）或纯看图选（好图、垃圾公司）。我们要的赢家是两者的<strong>交集</strong>。池子更小，但里面的每一条都真的能游。</div></div>

      {
        title:"第2节 买入：学会 VCP，胜率翻倍", tags:[["trend","趋势"],["vol","量能"]],
        body:`<p>这是最密集的一节，跟住。</p>
        <h4>VCP 到底是什么</h4>
        <p>VCP 代表 Volatility Contraction Pattern（波动收缩形态），是 Mark Minervini 建立其职业生涯的核心 setup。它是专业交易者用来精确择时入场的核心工具。</p>
        <p>画面是这样的：一只强势股上涨 30% 或更多，然后开始「休息」。这个休息有特定的形状。</p>
        <ul>
          <li>第一次回调：深 25–35%，整理一段时间。</li>
          <li>第二次回调：15–20%，更浅更短。</li>
          <li>第三次回调（如果有）：5–10%，很小。</li>
          <li>每一次回调都比上一次更浅、更短、量更低。</li>
        </ul>
        <p>画出来你会得到一个收紧的楔形 —— 一根正在被压缩的弹簧。</p>
        <h4>三个收缩必须同时发生</h4>
        <p>这是大多数人忽略的部分。真正的 VCP 不只是价格变紧 —— 三件事必须同时收缩：</p>
        <ol style="padding-left:20px">
          <li><strong>价格收缩。</strong>每次回调比上次浅。表层。</li>
          <li><strong>量能枯竭。</strong>到形态末期，平均日成交量明显跌破 50 日均量。你常会看到几个「FU days」—— Minervini 的说法，「Fucking Ugly days」，成交量低得诡异。那是卖方耗尽了，没人想卖了。</li>
          <li><strong>波动收缩。</strong>日内振幅收窄。你会得到「tight closes」—— 连续几天 close-to-close 的波动低于 1%，K 线看起来像叠在一起。</li>
        </ol>
        <p>当三者同时发生，供给被抽干。买方的一个火星就能点燃行情。这是这个游戏里最高概率的入场点。</p>
        <h4>枢轴点（Pivot Point）：真正的触发价</h4>
        <p>一旦收缩成熟，整理区间的高点就是你的枢轴点（pivot point）。实操中你用 <strong>pivot + 10 美分</strong>作为真实触发。</p>
        <p>两个硬条件同时点火：</p>
        <ul><li>价格突破 pivot。</li><li>突破日成交量比 50 日均量高 40–50%+。</li></ul>
        <p>两个都要。只有价格没有量是等着失败的假突破 —— 大约一半时间它会直接打回。</p>
        <p><strong>买入区：</strong>pivot 到 pivot 上方约 5%。超过 5% 你就是在追。等下一个 base 或一个 pocket pivot。追高会压缩你的止损、毁掉你的盈亏比。</p>
        <h4>Pocket Pivot：base 内部的提前入场</h4>
        <p>如果一只股票很强但还没形成完整的 VCP，有一个更早的入场点叫 Pocket Pivot，来自 Gil Morales 和 Chris Kacher：</p>
        <div class="callout co-info"><span class="ci">❝</span><div>一个单独的上涨日，其成交量超过<strong>前 10 个交易日中最大下跌日</strong>的成交量。</div></div>
        <p>说白了：买方刚刚压过了近期每一波卖方。这是机构吸筹在公开突破之前的泄漏 —— 一个「口袋里的 pivot」。</p>
        <div class="callout co-key"><span class="ci">🔗</span><div><strong>出处：</strong>VCP = Minervini；Pocket Pivot = Morales &amp; Kacher。图解见 ❓ 常见误区「pivot 和 pocket pivot 在哪」。</div></div>`,
        source:"《The only trading tutorial you need》全文 · §2"
      },
      {
        title:"第3节 止损：没有商量余地", tags:[["risk","风控"]],
        body:`<p>再说一遍：<strong>不会割肉的人，在这个市场活不过三年。</strong></p>
        <h4>硬规则：7–8%</h4>
        <p>从入场价下跌 7–8%，你就卖。没有例外。这条规则来自 William O'Neil，已经过几十年的压力测试。</p>
        <p>为什么是这个数？一个真正的突破不应该让你浮亏超过 7%。如果它做到了，说明突破失败了。继续待着只会加深伤害。</p>
        <h4>能更紧就更紧</h4>
        <p>8% 是上限，不是目标。实操中我用下面这几个里最紧的那个：</p>
        <ul>
          <li><strong>pivot 下方一点。</strong>如果逻辑是「它要突破了」，收盘跌回 pivot 下方就否定了这个逻辑。出。</li>
          <li><strong>入场日低点下方 2–3%。</strong>非常紧，适合 swing 入场。</li>
        </ul>`,
        source:"《The only trading tutorial you need》全文 · §3"
      },
      {
        title:"第4节 加仓：金字塔向上，绝不向下", tags:[["mom","动量"],["risk","风控"]],
        body:`<h4>唯一的原则</h4>
        <p>在你已经正确的方向上加仓。就这样。</p>
        <p>反过来 —— 给亏损单加仓以摊低成本 —— 是摧毁散户账户的头号杀手。「现在更便宜了」感觉很聪明。市场的回应是：「对，明天还会更便宜。」</p>

        <p>我实际怎么分批建仓：</p>
        <ul>
          <li><strong>第一批：50%</strong> 的目标仓位。在突破 pivot 时。</li>

        <p><em>（原文此处配图：Long 1–5 逐级加仓，Stop Loss 1–5 同步抬升，最后 Close。图解见 📚 交易方法论「金字塔结构」自绘图。）</em></p>

      {
        title:"第5节 卖出：两个离场理由", tags:[["risk","风控"],["vol","量能"]],
        body:`<p>卖出是交易中最难的部分。一笔糟糕的买入花你 7–8%。一笔糟糕的卖出能把 100% 的盈利变成 20%，或把 20% 的盈利变成亏损。</p>
        <h4>进攻性卖出（锁定利润）</h4>
        <p>股票涨了。什么时候获利了结？</p>
        <p><strong>8 周持有法则。</strong>如果一只股票在突破后 3 周内暴涨 20%+，那是一个「强力发射（power launch）」信号。在考虑卖出前至少持有 8 周 —— 历史上，大多数妖股都正是这样起步的。如果涨得慢（8 周才涨 20%），可以早点分批止盈。</p>
        <p><strong>Climax Run（抛物线顶）。</strong>在一只已经大涨的股票上留意这些信号：</p>
        <ul>
          <li>最近 2–3 周上涨 25–30%+。</li>
          <li>连续多根大振幅阳线，日内振幅在扩张。</li>
          <li>巨量跳空高开。</li>
          <li>价格向上突破其正常的上轨趋势通道。</li>
        </ul>
        <p>当你看到这些，不卖就是贪婪。减 50% 或全部清仓。</p>
        <p><strong>Churning（巨量但不涨）。</strong>连续多日极高成交量，但股票几乎不动或收在低位。那是伪装的派发 —— 机构在向散户需求里卖货。你会看到的最清晰的顶部信号之一。</p>
        <h4>防御性卖出（保护自己）</h4>
        <p>当趋势破了，你就走：</p>
        <ul>
          <li>放量跌破 50 日均线（周线则是 10 周均线）。CAN SLIM 里最干净的卖出信号之一。</li>
          <li>跌破上升趋势线。连接近期有意义的低点；如果价格切穿，趋势结构受损。</li>
          <li>派发日堆积。个股或指数上：4–5 周内 5+ 个派发日（成交量高于前一日、收跌 0.2%+）告诉你大资金在撤离。</li>

        <h4>真正的难题是执行</h4>
        <p>识别信号是容易的部分。扣下扳机才难。每个人都犹豫 ——「万一它涨回来呢？」「再等一天？」—— 然后眼看着盈利蒸发成亏损。</p>
        <p>我个人的窍门：卖出信号一触发，我就下单。不再重新讨论这个问题。如果我后来证明错了，我认这个 L。长期看，严格执行者赢，一直破例的人输。</p>
        <div class="callout co-info"><span class="ci">💭</span><div><strong>我的思考：</strong>「放量跌破 50 日线」是这里写的<strong>防御性卖出</strong>，对应长线核心仓；而 5/27 那篇专文把日常 trailing 细化成了 10/21 EMA 的状态机。两者不矛盾 —— 慢线管核心仓最终离场，快线管 swing 日常上抬。详见 🪜 Trailing 章节。</div></div>`,
        source:"《The only trading tutorial you need》全文 · §5"

      {
        title:"第6节 记交易日志 + 写在最后", tags:[["base","纪律"],["base","总纲"]],
        body:`<h4>6. 还有一件事：每笔交易都记日志</h4>
        <p>上面所有内容都不如这一条有价值，而它和技术毫无关系：<strong>记交易日志。</strong></p>
        <p>每笔交易，写下：</p>
        <ul>
          <li>你为什么买。VCP？pocket pivot？什么 base？</li>
          <li>当时市场环境什么样。</li>
          <li>你的止损在哪。</li>
          <li>你的加仓计划。</li>
          <li>你怎么离场的、为什么，包括盈亏（P&amp;L）。</li>

        </ul>
        <p>坚持六个月，你会震惊地发现你有多少亏损是同一个错误在重复。这比你读的任何书都有用，因为这是<strong>你自己</strong>关于<strong>你自己</strong>行为的数据。</p>
        <h4>写在最后（Wrapping Up）</h4>
        <p>这篇写得很长，因为我想把它都放在一个地方。但拉远看，方法很简单：</p>
        <ol style="padding-left:20px">
          <li><strong>选股：</strong>基本面 + 技术面 + 机构 + 市场。四项全要。</li>

        <p>市场奖励那些既有方法、又去执行的人。大多数人亏钱不是因为不知道该做什么，而是因为他们知道，却还是不做。</p>

        <p><strong>大多数人卡在这里，而不是入场。</strong></p>
        <p>我做了这么多年，见过太多账户的 P&amp;L 曲线长这样：一笔好的突破，买在 pivot 上方 $0.50，涨到 +30% —— 然后慢慢吐回到 +5%、+0%、-3%，最后在原始 ATR 止损被打掉。</p>

        <h4>一、为什么 trail 比入场更决定 P&amp;L</h4>
        <p>来算一笔账。同样一笔交易，$100 买入，股票最终走到 $150 然后回调到 $130。</p>

        <p><strong>Trail 得当：</strong>在 $140 附近止损已经提到 $135，$150 顶点附近提到 $142。最后你 $142 走人，<strong>+42%</strong>。</p>

        <p>反过来更狠。$100 → $108 → 回到 $96。不 trail：原始 -5% 止损被打，亏 5%。Trail 到保本 $100.5：这笔交易打平。<strong>同一笔判断，差别是亏 5% 和不亏。</strong></p>

      {
        title:"二、状态机 A/B/C（亏损区 / 微利区 / 确认上涨）", tags:[["risk","风控"]],
        body:`<p><strong>一笔交易只有几种状态，每种状态对应不同动作。</strong>我的执行框架很简单：入场之后，这笔交易任何时刻都只能处在以下几个状态之一。每个状态对应的 trail 动作是固定的，不靠判断，靠纪律。</p>
        <h4>状态 A：亏损区间（-7% 到 0%）</h4>
        <p><strong>什么都不做。</strong>初始 ATR 或固定百分比止损就是你的整个防线。</p>
        <p>唯一的纪律：<strong>不要降低止损。</strong>任何想「再给它一个机会」的念头，都是亏大钱的入口。Nicolas Darvas 把止损叫「保险」，保险触发就触发，触发你的损失是确定的、可控的。你为了「省一笔保费」把止损往下挪 2%，这笔交易就从保险变成了赌博。</p>
        <h4>状态 B：微利区间（0 到 +3%）</h4>
        <p><strong>还不该动。</strong>一笔好的突破买入，前两三天通常还在消化获利盘 —— 盘中刺一下入场价是正常呼吸。如果你这时候把止损提到入场价，你大概率被洗出去，然后看着它走到 +30%。</p>
        <p>这阶段的纪律是：<strong>忍住，什么都不做。</strong>给突破至少 3 个交易日的发展空间。</p>
        <h4>状态 C：确认上涨（+3% 到 +10%）</h4>
        <p><strong>第一次上抬：止损 → 保本 + 0.1%。</strong></p>
        <p>触发条件：股价从入场价上涨 3% 以上，且<strong>收盘价位于当日上半区</strong>（意味着是真涨，不是冲高回落）。</p>
        <p>为什么是 +0.1% 而不是刚好入场价？因为扣掉手续费后还得是正的，<strong>心理上真正「不亏」</strong>。否则你触发了保本止损，P&amp;L 显示 -$12 手续费，大脑还是会记成「这笔我亏了」，纪律就开始动摇。</p>
        <p>保本止损最大的价值是心理层面的 —— 一旦止损提到保本位，<strong>这笔交易对你来说已经是 free trade</strong>。Free trade 状态下，你才有可能让利润真正奔跑。否则每个回调你都会想锁利润，然后把 monster 卖在 +15%。</p>`,

      {
        title:"二、状态 D：趋势确立 —— EMA 追踪模式", tags:[["trend","趋势"],["risk","风控"]],
        body:`<h4>状态 D：趋势确立（+10% 以上）</h4>
        <p><strong>进入 EMA 追踪模式。</strong>这是 swing trade 的主战场，绝大多数交易停留在这个状态最久。</p>
        <p>选哪条均线，完全取决于你打算持多久：</p>
        <p><strong>5 EMA</strong> —— 日内或短线 scalp。极高灵敏度，稍微一回调就走。</p>
        <p><strong>10 EMA</strong> —— 持仓 5 到 20 天，swing trade 的主力 trail 线。Oliver Kell 用的就是这条，他的做法是 <strong>10 EMA × 0.99 作为触发线</strong> —— 给 EMA 留 1% 的缓冲，避免被假动作震出来。</p>
        <p><strong>21 EMA</strong> —— 持仓 2 到 8 周，中线波段。强势股大多沿着 21 EMA 走，跌破说明趋势可能变坏。</p>
        <p><strong>50 SMA</strong> —— 大趋势保护线，monster stock 长线持有用这条。</p>
        <p><strong>两个一定要记住的细节：</strong></p>
        <p>第一，<strong>看收盘价，不看盘中价。</strong>很多人输在这里 —— 盘中股价刺破 10 EMA 0.5%，他手抖卖了，结果当天收盘拉回到 EMA 上方，股票继续涨。Oliver Kell 的纪律是 <strong>3:59 PM 检查一次</strong>，只有收盘价低于 10 EMA × 0.99 才触发离场。盘中所有的「破线」都不算数。</p>
        <p>第二，<strong>EMA 是动态的，止损线每天都在动。</strong>这不是「设一次然后忘记」，这是每个交易日收盘后必须重新计算一次的工作。</p>
        <div class="callout co-info"><span class="ci">💭</span><div><strong>我的思考：</strong>这一段就是你问「MA50 还是 10EMA」的权威答案 —— swing 用 10 EMA，50 SMA 只给长线 monster。<code>10 EMA × 0.99</code> + 收盘(3:59PM)检查 + 每日重算，这三条全是可直接写进 Pine 的规则。</div></div>`,
        source:"《如何正确上抬止损》全文 · §2 状态D"
      },
      {
        title:"二、状态 E：垂直延伸 / 抛物线", tags:[["risk","风控"],["vol","量能"]],
        body:`<h4>状态 E：垂直延伸 / 抛物线（远离 21 EMA 25% 以上）</h4>
        <p><strong>切换 trail 方法。EMA 不再适用。</strong></p>
        <p>这是大多数人最容易吐回利润的阶段。一只股票从 $100 涨到 $250，21 EMA 可能还在 $180。如果你死守 21 EMA trail，等触发离场时你已经从 $250 跌回 $180，<strong>吐回了 70 个点的利润</strong>。</p>
        <p>抛物线阶段的特征是<strong>越涨越快，EMA 永远跟不上</strong>。这时候有两种处理方式：</p>
        <p><strong>趋势线 trail</strong> —— 画出最近 2 到 3 周的上升趋势线（连接两个或以上低点），止损设在趋势线下方一点。趋势线的斜率比 EMA 陡，更贴近实际走势。</p>
        <p><strong>直接切换到 5 EMA</strong> —— 让追踪从「中等灵敏度」变成「极高灵敏度」。代价是更容易被震出来，但收益是利润回吐最小。</p>
        <p>抛物线阶段的另一个动作是<strong>主动减仓 + 收紧 trail 并行</strong>。不是 either / or，是 and。垂直拉升时分批落袋一部分（20%-50%），剩下的用紧 trail 跑。这样无论之后是 climax top 还是继续涨，你都赢。</p>
        <div class="callout co-info"><span class="ci">💭</span><div><strong>我的思考：</strong>「远离 21EMA 25%+」就是 MU/OKTA 在高分时显示 <strong>REDUCE</strong> 的量化触发 —— 与第一篇「买入区上限 pivot+5%」「climax 减 50%」完全自洽。这是 Kova Score 动作标签的核心逻辑。</div></div>`,
        source:"《如何正确上抬止损》全文 · §2 状态E"
      },
      {
        title:"三、五个错误 + 四、铁律 + 写在最后", tags:[["risk","风控"],["base","纪律"]],
        body:`<h4>三、Trail 最常见的五个错误</h4>
        <p><strong>错误一：看盘中价，不看收盘价。</strong>你设的是 10 EMA trail，但盘中股票刺破 EMA 0.3% 你就慌了。结果当天收盘拉回 EMA 上方继续涨。Trail 的纪律是 3:59 PM 检查，中间任何价格都不算数。</p>
        <p><strong>错误二：在 climax 阶段还用慢 EMA。</strong>抛物线阶段如果继续用 21 EMA，等于自动放弃 30% 以上的利润。状态变了，工具也要换。</p>
        <p><strong>错误三：加仓后不重设止损。</strong>加仓改变了平均成本，如果你不把整个仓位的止损按新平均成本重新算一遍，你的实际风险就失控了。每加一注，止损重算一次。</p>
        <p><strong>错误四：把 trail 当被动等待，不当主动管理。</strong>Trail 是底线，不是唯一动作。高位放量、领头股反向跳水、板块整体出货 —— 这些信号出现时，你不应该等 trail 被触发，你应该主动减仓。</p>
        <p><strong>错误五：时间框架混用。</strong>Swing trade 用 10 EMA trail，但你盯着 5 分钟图看 —— 这是混乱，不是纪律。你的 trail 用什么周期，你看盘就用什么周期。否则你只是在用日线策略给自己制造日内焦虑。</p>
        <h4>四、一条永远不能违反的规则</h4>
        <p><strong>止损只能向上，不能向下。永远不行。</strong></p>
        <p>这条规则的存在不是因为它「理论上对」，而是因为<strong>只要破了一次，你就彻底破了</strong>。</p>
        <p>第一次降止损，你的理由会非常充分：「它就是被洗一下，基本面没变，再给一周。」然后股票继续跌。第二次降止损时，理由更充分了：「现在卖就是卖在底，反弹就在眼前。」再跌。第三次的时候，你已经不在做交易了，你在做祈祷。</p>
        <p>这就是 Chris Flanders 讲的「交易者死亡螺旋」—— 行动 → 亏损 → 再行动 → 再亏损，中间没有任何停顿和复盘。打断这个螺旋的唯一方法，是把「止损只能向上」这条规则当成物理定律，不是建议。</p>
        <h4>写在最后</h4>
        <p>我自己的总结很短。</p>
        <p>不会止损的人，<strong>活不过三年</strong>。<br>会止损但不会上抬的人，<strong>赚不到大钱</strong>。<br>两件都会的人，<strong>才有资格谈复利</strong>。</p>
        <p>Trail 不是技术问题，是工序问题。买入考验的是判断力，trail 考验的是你愿不愿意每天收盘后花 10 分钟，把每一只持仓的止损重新算一遍。</p>
        <p><strong>这 10 分钟，就是 +30% 和 +130% 之间的差距。</strong></p>
        <p style="color:var(--text2)">—— Kova</p>`,
        source:"《如何正确上抬止损》全文 · §3+§4+结语"
      },
    ]
  },
];

/* ── 渲染 ── */
const main=document.getElementById('main'), toc=document.getElementById('toc');

// Hero
const totalCards=CHAPTERS.reduce((a,c)=>a+c.cards.length,0);
main.insertAdjacentHTML('beforeend',`
  <div class="hero">
    <h1>🎯 Kova 量化指标 · 倒推研究</h1>
    <p>把 Kova 的交易方法与指标说明翻译、总结、归档到这里，作为反向推导公式的素材库 —— 攒够了就建模 + 回测校准。</p>
    <div class="meta">
      <div><b>${totalCards}</b>已记录卡片</div>
      <div><b>${CHAPTERS.length}</b>章节</div>
      <div><b id="upd"></b>最后更新</div>
    </div>
  </div>`);
document.getElementById('upd').textContent=new Date().toLocaleDateString('zh-CN');

// 侧栏分组
const groups={};
CHAPTERS.forEach(c=>{(groups[c.group]=groups[c.group]||[]).push(c)});
let tocHtml='';
for(const g in groups){
  tocHtml+=`<div class="toc-group"><div class="toc-group-t">${g}</div>`;
  groups[g].forEach(c=>{ tocHtml+=`<a href="#${c.id}" data-id="${c.id}"><span class="dot"></span>${c.icon} ${c.title.split(' · ')[0]}</a>`; });
  tocHtml+=`</div>`;
}
toc.innerHTML=tocHtml;

// 章节
CHAPTERS.forEach(c=>{
  let html=`<section id="${c.id}">
    <div class="sec-head"><div class="ic">${c.icon}</div><h2>${c.title}</h2>
      <span class="cnt">${c.cards.length} 条</span></div>`;
  if(c.intro) html+=`<p style="color:var(--text2);font-size:14px;margin-bottom:18px">${c.intro}</p>`;
  if(c.cards.length===0){
    html+=`<div class="empty"><div class="e-ic">📥</div>暂无内容 —— 发来截图后我会填充到这里</div>`;
  }else{
    c.cards.forEach((card,i)=>{
      const tags=(card.tags||[]).map(t=>`<span class="tag t-${t[0]}">${t[1]}</span>`).join('');
      html+=`<div class="card" data-text="${(card.title+' '+card.body).replace(/<[^>]+>/g,' ').replace(/"/g,'')}">
        <div class="card-t"><span class="num">${String(i+1).padStart(2,'0')}</span>${card.title}</div>
        ${tags?`<div class="tags">${tags}</div>`:''}
        <div class="card-body">${card.body}</div>
        ${card.source?`<div class="src">来源 <span class="badge">${card.source}</span></div>`:''}
      </div>`;
    });
  }
  html+=`</section>`;
  main.insertAdjacentHTML('beforeend',html);
});

// 进度条 + 滚动高亮
const links=[...document.querySelectorAll('.toc a')];
const secs=CHAPTERS.map(c=>document.getElementById(c.id));
function onScroll(){
  const sc=window.scrollY, h=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('progress').style.width=(sc/h*100)+'%';
  let cur=secs[0].id;
  for(const s of secs){ if(s.getBoundingClientRect().top<140) cur=s.id; }
  links.forEach(a=>a.classList.toggle('on',a.dataset.id===cur));
}
window.addEventListener('scroll',onScroll,{passive:true}); onScroll();

// 搜索
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('section').forEach(sec=>{
    const cards=sec.querySelectorAll('.card');
    let any=false;
    cards.forEach(card=>{
      const hit=!q||(card.dataset.text||'').toLowerCase().includes(q);
      card.style.display=hit?'':'none'; if(hit)any=true;
    });
    // 搜索时隐藏"有卡片但无命中"的章节；无卡片的空章节也在搜索时隐藏
    sec.style.display=(q && (!any || cards.length===0)) ? 'none' : '';
  });
});
</script>
</body>
</html>
